<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Calling the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Reset Password</h2>
        <p style="text-align: center; color: #666; margin-bottom: 15px; font-size: 14px;">Enter your email to receive a password reset link.</p>
        <form action="Login.html">
            <div class="input-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" required>
            </div>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </form>
        <p class="toggle-text"><a href="Login.html">Back to Login</a></p>
    </div>

</body>
</html>
